# Local development only. No project reference or hosted account is selected.
project_id = "nadeem-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/ar/auth/callback", "http://localhost:3000/en/auth/callback", "http://localhost:3000/ar/auth/callback?next=/ar/update-password", "http://localhost:3000/en/auth/callback?next=/en/update-password"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[storage]
enabled = false

[realtime]
enabled = false

[inbucket]
enabled = true
port = 54324

[analytics]
enabled = false
